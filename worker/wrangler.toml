name = "cos-drive-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
# COS 存储桶名称，必须带 APPID 后缀（在 COS 控制台桶列表里能直接看到）
COS_BUCKET = "file-1250000000"

# COS 存储桶所在地域，例如 ap-guangzhou / ap-shanghai / ap-beijing
COS_REGION = "ap-guangzhou"

# 前端允许访问的域名，多个用逗号分隔（部署后改为你的实际域名）
ALLOWED_ORIGINS = "http://localhost:5173,https://file.你的域名.com,https://cos-drive-frontend.pages.dev,https://drive.你的域名.com"

# 以下通过 wrangler secret put 命令设置（不要写在这里）：
# wrangler secret put COS_SECRET_ID     → 腾讯云 API 密钥 SecretId
# wrangler secret put COS_SECRET_KEY    → 腾讯云 API 密钥 SecretKey
# wrangler secret put JWT_SECRET        → 随机长字符串，用于签发 JWT
# wrangler secret put ADMIN_USERNAME    → 管理员用户名
# wrangler secret put ADMIN_PASSWORD    → 管理员密码
